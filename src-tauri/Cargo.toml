[package]
name = "vextra-studio"
version = "1.0.0"
description = "Vextra Studio – web development and 2D/3D game creation"
authors = ["Vextra"]
edition = "2021"
license = "MIT"

[lib]
name = "vextra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ureq = "2"
regex = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
