<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b1f3a"/><stop offset="1" stop-color="#0b0d1c"/></linearGradient>
    <linearGradient id="l" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7c9bff"/><stop offset="1" stop-color="#4b5fe0"/></linearGradient>
    <linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34e1c5"/><stop offset="1" stop-color="#12a58e"/></linearGradient>
    <linearGradient id="t" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d4ff"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".42" r=".6"><stop offset="0" stop-color="#5b6cff" stop-opacity=".45"/><stop offset="1" stop-color="#5b6cff" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1024" height="1024" rx="230" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>
  <!-- isometric faceted V: two beams meeting at the bottom, plus a top cap cube -->
  <g transform="translate(512 548)">
    <!-- left beam -->
    <polygon points="-300,-250 -170,-325 -20,-70 -20,170 -150,95 -150,-120" fill="url(#l)"/>
    <polygon points="-300,-250 -170,-325 -150,-120 -280,-45" fill="url(#t)" opacity=".92"/>
    <!-- right beam -->
    <polygon points="300,-250 170,-325 20,-70 20,170 150,95 150,-120" fill="url(#r)"/>
    <polygon points="300,-250 170,-325 150,-120 280,-45" fill="url(#t)" opacity=".85"/>
    <!-- bottom vertex -->
    <polygon points="-20,170 20,170 20,-70 -20,-70" fill="#0d1030" opacity=".35"/>
    <polygon points="-150,95 -20,170 0,225 -130,150" fill="#2f3ec0"/>
    <polygon points="150,95 20,170 0,225 130,150" fill="#0e8a77"/>
    <!-- spark -->
    <polygon points="0,-230 38,-170 0,-110 -38,-170" fill="#fff" opacity=".95"/>
  </g>
</svg>
